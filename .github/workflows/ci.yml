name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported version catches syntax it does not understand;
        # the newest is what the application is developed against.
        php: ['8.2', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, intl
          coverage: none
          tools: composer

      - name: Syntax
        run: php bin/lint.php

      - name: Translations
        run: php bin/check_translations.php

      - name: Theme contrast
        run: php bin/check_contrast.php

      - name: Install dev tools
        if: matrix.php == '8.5'
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Static analysis
        if: matrix.php == '8.5'
        run: composer analyse

      - name: Coding style
        if: matrix.php == '8.5'
        run: composer cs

  assets:
    name: CSS and JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so a secret removed in a later commit is still found.
          fetch-depth: 0
      # The plain binary rather than gitleaks-action, which needs a licence key
      # for repositories owned by an organisation.
      - name: Install gitleaks
        run: |
          VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
      - name: Scan
        run: ./gitleaks git --redact --no-banner --verbose .
